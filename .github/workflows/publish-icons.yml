# .github/workflows/publish-icons.yml
# Place in: buni/.github/workflows/publish-icons.yml

name: Publish @buni-design/icons

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'
      force:
        description: 'Force publish even if no changes'
        required: false
        type: boolean
        default: false

  # Triggered when patterns/icons/tokens change in main branch
  push:
    branches: [main]
    paths:
      - 'packages/icons/**'
      - 'apps/buni-avs/public/icons/**'
      - '.github/workflows/publish-icons.yml'

jobs:
  build-and-publish:
    name: Build & Publish @buni-design/icons
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      # ─────────────────────────────────────────────────────────────────
      # Checkout & Setup
      # ─────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false

      # ─────────────────────────────────────────────────────────────────
      # Install Dependencies
      # ─────────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./buni

      # ─────────────────────────────────────────────────────────────────
      # Build Package
      # ─────────────────────────────────────────────────────────────────
      - name: Build @buni-design/icons
        run: pnpm run build --filter @buni-design/icons
        working-directory: ./buni

      # ─────────────────────────────────────────────────────────────────
      # Verify Build Output
      # ─────────────────────────────────────────────────────────────────
      - name: Verify dist contents
        run: |
          echo "📦 Package contents:"
          ls -la packages/icons/dist/
          echo ""
          echo "📄 icons.css size: $(wc -c < packages/icons/dist/icons.css) bytes"
          echo "📄 React components: $(find packages/icons/dist/react -name '*.js' | wc -l)"
          echo "📄 SVG files: $(find packages/icons/dist/svg -name '*.svg' | wc -l)"
        working-directory: ./buni

      # ─────────────────────────────────────────────────────────────────
      # Check for Changes (only for push trigger)
      # ─────────────────────────────────────────────────────────────────
      - name: Check for changes
        id: changes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet packages/icons/dist/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes in dist/"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in dist/"
          fi
        working-directory: ./buni

      # ─────────────────────────────────────────────────────────────────
      # Determine Version Bump
      # ─────────────────────────────────────────────────────────────────
      - name: Determine version bump
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "bump=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "bump=patch" >> $GITHUB_OUTPUT
          else
            echo "bump=none" >> $GITHUB_OUTPUT
          fi

      # ─────────────────────────────────────────────────────────────────
      # Publish to npm
      # ─────────────────────────────────────────────────────────────────
      - name: Publish to npm
        if: steps.version.outputs.bump != 'none' || github.event.inputs.force == 'true'
        run: |
          cd packages/icons
          if [ "${{ steps.version.outputs.bump }}" != "none" ]; then
            npm version ${{ steps.version.outputs.bump }} --no-git-tag-version --workspaces=false
          fi
          npm publish --access public --provenance
        working-directory: ./buni
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ─────────────────────────────────────────────────────────────────
      # Commit Version Bump
      # ─────────────────────────────────────────────────────────────────
      - name: Commit and push version bump
        if: steps.version.outputs.bump != 'none' || github.event.inputs.force == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/icons/package.json packages/icons/dist/
          git commit -m "chore: publish @buni-design/icons update [skip ci]"
          git push
        working-directory: ./buni

      # ─────────────────────────────────────────────────────────────────
      # Notify Success
      # ─────────────────────────────────────────────────────────────────
      - name: Notify completion
        if: always()
        run: |
          if [ "${{ steps.version.outputs.bump }}" != "none" ] || [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "✅ @buni-design/icons published successfully!"
            echo "📦 New version: $(cat packages/icons/package.json | jq -r .version)"
          else
            echo "ℹ️ No changes to publish"
          fi
        working-directory: ./buni