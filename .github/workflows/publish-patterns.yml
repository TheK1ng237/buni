# .github/workflows/sync-patterns.yml
# Place in: buni/.github/workflows/sync-patterns.yml

name: Sync Patterns & Publish @buni/patterns

on:
  # Triggered by backend via repository_dispatch
  repository_dispatch:
    types: [pattern-published, pattern-updated, pattern-unpublished]
  # Manual trigger
  workflow_dispatch:
    inputs:
      pattern_slug:
        description: 'Specific pattern slug to sync (optional)'
        required: false
        type: string
      force_publish:
        description: 'Force publish even if no changes'
        required: false
        type: boolean
        default: false

jobs:
  sync-and-publish:
    name: Sync from Backend & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write  # For pushing version bump
      packages: write  # For npm publish
      id-token: write  # For npm provenance

    env:
      AVS_BACKEND_URL: ${{ secrets.AVS_BACKEND_URL }}
      AVS_API_KEY: ${{ secrets.AVS_API_KEY }}

    steps:
      # ─────────────────────────────────────────────────────────────────
      # Checkout & Setup
      # ─────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false

      # ─────────────────────────────────────────────────────────────────
      # Install Dependencies
      # ─────────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./buni

      # ─────────────────────────────────────────────────────────────────
      # Sync from Backend
      # ─────────────────────────────────────────────────────────────────
      - name: Sync patterns from backend
        run: pnpm run sync:backend --filter @buni/patterns
        working-directory: ./buni
        env:
          AVS_BACKEND_URL: ${{ secrets.AVS_BACKEND_URL }}
          AVS_API_KEY: ${{ secrets.AVS_API_KEY }}

      # ─────────────────────────────────────────────────────────────────
      # Build Package
      # ─────────────────────────────────────────────────────────────────
      - name: Build @buni/patterns
        run: pnpm run build --filter @buni/patterns
        working-directory: ./buni

      # ─────────────────────────────────────────────────────────────────
      # Verify Build Output
      # ─────────────────────────────────────────────────────────────────
      - name: Verify dist contents
        run: |
          echo "📦 Package contents:"
          ls -la packages/patterns/dist/
          echo ""
          echo "📄 patterns.css size: $(wc -c < packages/patterns/dist/patterns.css) bytes"
          echo "📄 tokens.css size: $(wc -c < packages/patterns/dist/tokens.css) bytes"
          echo "📄 SVG files: $(find packages/patterns/dist/svg -name '*.svg' | wc -l)"
        working-directory: ./buni

      # ─────────────────────────────────────────────────────────────────
      # Check for Changes
      # ─────────────────────────────────────────────────────────────────
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet packages/patterns/dist/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes in dist/"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in dist/"
          fi
        working-directory: ./buni

      # ─────────────────────────────────────────────────────────────────
      # Publish to npm (if changes or forced)
      # ─────────────────────────────────────────────────────────────────
      - name: Publish to npm
        if: steps.changes.outputs.changed == 'true' || github.event.inputs.force_publish == 'true'
        run: |
          cd packages/patterns
          # Bump patch version
          npm version patch --no-git-tag-version --workspaces=false
          # Publish with provenance
          npm publish --access public --provenance
        working-directory: ./buni
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ─────────────────────────────────────────────────────────────────
      # Commit Version Bump
      # ─────────────────────────────────────────────────────────────────
      - name: Commit and push version bump
        if: steps.changes.outputs.changed == 'true' || github.event.inputs.force_publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/patterns/package.json packages/patterns/dist/
          git commit -m "chore: publish @buni/patterns update [skip ci]"
          git push
        working-directory: ./buni

      # ─────────────────────────────────────────────────────────────────
      # Notify Success
      # ─────────────────────────────────────────────────────────────────
      - name: Notify completion
        if: always()
        run: |
          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "✅ @buni/patterns published successfully!"
            echo "📦 New version: $(cat packages/patterns/package.json | jq -r .version)"
          else
            echo "ℹ️ No changes to publish"
          fi
        working-directory: ./buni