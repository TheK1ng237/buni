# .github/workflows/publish-tokens.yml
# Place in: buni/.github/workflows/publish-tokens.yml

name: Publish @buni-design/tokens

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'
  push:
    branches: [main]
    paths:
      - 'packages/tokens/**'

jobs:
  build-and-publish:
    name: Build & Publish @buni-design/tokens
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build @buni-design/tokens
        run: pnpm --filter @buni-design/tokens run build
        working-directory: .

      - name: Verify dist contents
        run: |
          echo "📦 Package contents:"
          ls -la packages/tokens/dist/
        working-directory: .

      - name: Determine version bump
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "bump=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "bump=patch" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.version.outputs.bump != ''
        run: |
          cd packages/tokens
          npm version ${{ steps.version.outputs.bump }} --no-git-tag-version --workspaces=false
          npm publish --access public --provenance
        working-directory: .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit and push version bump
        if: steps.version.outputs.bump != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/tokens/package.json
          git commit -m "chore: publish @buni-design/tokens update [skip ci]"
          git push
        working-directory: .

      - name: Notify completion
        if: success()
        run: |
          echo "✅ @buni-design/tokens published successfully!"
          echo "📦 New version: $(cat packages/tokens/package.json | jq -r .version)"
        working-directory: .