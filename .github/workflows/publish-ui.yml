# .github/workflows/publish-ui.yml
# Place in: buni/.github/workflows/publish-ui.yml

name: Publish @buni-design/ui

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'
      force:
        description: 'Force publish even if no changes'
        required: false
        type: boolean
        default: false

  push:
    branches: [main]
    paths:
      - 'packages/ui/**'
      - '.github/workflows/publish-ui.yml'

jobs:
  build-and-publish:
    name: Build & Publish @buni-design/ui
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./buni

      - name: Build @buni-design/ui
        run: pnpm run build --filter @buni-design/ui
        working-directory: ./buni

      - name: Verify dist contents
        run: |
          echo "📦 Package contents:"
          ls -la packages/ui/dist/
          echo ""
          echo "📄 Components: $(find packages/ui/dist/components -name '*.js' | wc -l)"
        working-directory: ./buni

      - name: Check for changes
        id: changes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet packages/ui/dist/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
        working-directory: ./buni

      - name: Determine version bump
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "bump=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "bump=patch" >> $GITHUB_OUTPUT
          else
            echo "bump=none" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.version.outputs.bump != 'none' || github.event.inputs.force == 'true'
        run: |
          cd packages/ui
          if [ "${{ steps.version.outputs.bump }}" != "none" ]; then
            npm version ${{ steps.version.outputs.bump }} --no-git-tag-version --workspaces=false
          fi
          npm publish --access public --provenance
        working-directory: ./buni
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit and push version bump
        if: steps.version.outputs.bump != 'none' || github.event.inputs.force == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/ui/package.json packages/ui/dist/
          git commit -m "chore: publish @buni-design/ui update [skip ci]"
          git push
        working-directory: ./buni

      - name: Notify completion
        if: always()
        run: |
          if [ "${{ steps.version.outputs.bump }}" != "none" ] || [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "✅ @buni-design/ui published successfully!"
            echo "📦 New version: $(cat packages/ui/package.json | jq -r .version)"
          else
            echo "ℹ️ No changes to publish"
          fi
        working-directory: ./buni